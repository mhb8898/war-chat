<!DOCTYPE html>
<html lang="en">
<head>

  <!-- FOUC prevention: apply saved/system theme before first paint -->
  <script>(function(){var t=localStorage.getItem('war-chat-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t)})();</script>
  <style>
    :root {

      --border: #23233a;

    html[data-theme="light"] {

    .view-video .video-controls button { padding: 0.75rem 1.5rem; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9375rem; transition: background 0.15s; }

    .admit-list { display: flex; flex-direction: column; gap: 0.5rem; }

    input, textarea {

      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }
    .profile-section p { margin: 0; font-size: 0.9375rem; }
    .profile-section strong { font-weight: 600; }
    .profile-section button { margin: 0; width: fit-content; }
    .profile-section .link-box { margin: 0; }
    /* Lobby view */
    .view-lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 2rem;
      background: var(--bg);
    }
    .lobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .lobby-card h2 { margin: 0; font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; text-align: center; }
    .lobby-card p { margin: 0; color: var(--text-2); font-size: 0.9rem; text-align: center; }
    .lobby-card input { margin: 0; }
    .lobby-card button { margin: 0; width: 100%; }
    .lobby-link {
      text-align: center;
      color: var(--accent);
      font-size: 0.875rem;
      text-decoration: none;
    }
    .lobby-link:hover { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <war-chat-header id="header"></war-chat-header>
      <button id="btnThemeToggle" class="btn-icon" title="Toggle theme" style="flex-shrink:0;margin-left:0.25rem"></button>
    </header>

    <main class="main">
      <!-- Setup / Login -->
      <div id="view-setup" class="view view-setup">
        <war-chat-setup></war-chat-setup>
      </div>

      <!-- Chats + Chat (split layout when logged in) -->
      <div id="view-main" class="view view-main">
        <war-chat-main></war-chat-main>
      </div>

      <!-- Profile -->
      <div id="view-profile" class="view view-profile">
        <war-chat-profile></war-chat-profile>
      </div>

      <!-- Video call (1:1) and meeting room -->
      <div id="view-video" class="view view-video">
        <div id="videoStatus">Connecting…</div>
        <div class="video-grid">
          <div class="video-box">
            <canvas id="videoRemoteCanvas"></canvas>
            <span class="video-label">Remote</span>
          </div>
          <div class="video-box">
            <video id="videoLocalPreview" autoplay playsinline muted></video>
            <span class="video-label">You</span>
          </div>
        </div>
        <div id="admitPanel" style="display:none;" class="admit-panel">
          <div class="admit-panel-title">Guests waiting to join</div>
          <div id="admitList" class="admit-list"></div>
        </div>
        <div class="video-controls">
          <button type="button" id="videoBtnMute" class="btn-mute" title="Mute">Mute</button>
          <button type="button" id="videoBtnCamera" class="btn-camera" title="Camera">Camera</button>
          <button type="button" id="videoBtnHangup" class="btn-hangup" title="End call">End call</button>
        </div>
      </div>

      <!-- Guest lobby -->
      <div id="view-lobby" class="view view-lobby">
        <div class="lobby-card">
          <h2>Join meeting</h2>
          <p id="lobbyStatus"></p>
          <div id="lobbyForm" style="display:flex;flex-direction:column;gap:0.75rem;">
            <input type="text" id="lobbyName" placeholder="Your display name" maxlength="64" autocomplete="off">
            <button id="btnLobbyJoin">Join as guest</button>
            <a href="#setup" class="lobby-link">I have an account</a>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer" id="appFooter">War Chat</footer>
  </div>

  <war-chat-modal id="newChatModal">
    <div class="modal-slot-content">
      <label for="newChatSearchModal">Search users</label>
      <input type="text" id="newChatSearchModal" placeholder="Type to search..." maxlength="64" autocomplete="off">
      <ul id="newChatUserList" class="user-list"></ul>
      <div id="newChatUserListEmpty" class="user-list-empty hidden">No users found</div>
      <div class="modal-actions">
        <button id="btnNewChatModalCancel">Cancel</button>
      </div>
    </div>
  </war-chat-modal>

  <war-chat-modal id="newGroupModal">
    <div class="modal-slot-content">
      <label for="newGroupName">Group name</label>
      <input type="text" id="newGroupName" placeholder="Group name" maxlength="64" autocomplete="off">
      <label>Add members</label>
      <ul id="newGroupUserList" class="user-list"></ul>
      <div id="newGroupUserListEmpty" class="user-list-empty hidden">No users found</div>
      <div class="modal-actions">
        <button id="btnNewGroupCancel">Cancel</button>
        <button id="btnNewGroupCreate">Create group</button>
      </div>
    </div>
  </war-chat-modal>

  <war-chat-modal id="addMemberModal">
    <div class="modal-slot-content">
      <label>Add member to group</label>
      <ul id="addMemberUserList" class="user-list"></ul>
      <div id="addMemberUserListEmpty" class="user-list-empty hidden">No users to add</div>
      <div class="modal-actions">
        <button id="btnAddMemberCancel">Cancel</button>
        <button id="btnAddMemberConfirm">Add</button>
      </div>
    </div>
  </war-chat-modal>

  <war-chat-modal id="newMeetingModal">
    <div class="modal-slot-content">
      <h2>New meeting</h2>
      <p style="margin:0;color:var(--text-2);font-size:0.875rem">Share this link — anyone can join as guest:</p>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <input type="text" id="meetingLinkInput" readonly style="flex:1;font-size:0.8125rem;font-family:ui-monospace,monospace">
        <button id="btnCopyMeetingLink" style="flex-shrink:0;margin:0">Copy</button>
      </div>
      <div class="modal-actions">
        <button id="btnStartMeeting" disabled>Start call</button>
      </div>
    </div>
  </war-chat-modal>

  <script src="qrcode.min.js"></script>
  <script src="wordlist.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
