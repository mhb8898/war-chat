# Build and release on version tag: Docker image to GHCR + multi-platform binaries to GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          provenance: false
          sbom: false

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          export VERSION=${{ steps.version.outputs.version }}
          export CGO_ENABLED=0
          export LDFLAGS="-s -w -X main.Version=${VERSION}"
          mkdir -p dist

          GOOS=linux   GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/war-chat-$VERSION-linux-amd64       ./cmd/server
          GOOS=linux   GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/war-chat-$VERSION-linux-arm64       ./cmd/server
          GOOS=darwin  GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/war-chat-$VERSION-darwin-amd64      ./cmd/server
          GOOS=darwin  GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/war-chat-$VERSION-darwin-arm64      ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/war-chat-$VERSION-windows-amd64.exe ./cmd/server

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
